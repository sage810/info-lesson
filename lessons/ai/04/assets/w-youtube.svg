<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="CookieRunSvg, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">
  <style id="svg-font">@font-face{font-family:'CookieRunSvg';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <!-- 동기유발 그림(2026-11-01): 왼쪽 어제 내가 본 영상 3개 → 가운데 물음표 화살표 → 오른쪽 오늘 아침 홈 화면 추천 영상들. 실제 앱 로고·화면은 그리지 않음 -->
  <defs>
    <marker id="ar" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L 14 7 L 0 14 Z" fill="#4b3b6b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" fill="#fffdf7"/>

  <!-- 왼쪽: 어제 내가 본 영상 -->
  <rect x="12" y="12" width="250" height="276" rx="16" fill="#f6f8fd" stroke="#4b3b6b" stroke-width="3"/>
  <path d="M12 58 V 28 a16 16 0 0 1 16 -16 H 246 a16 16 0 0 1 16 16 V 58 Z" fill="#c4d8f7" stroke="#4b3b6b" stroke-width="3"/>
  <text x="137" y="43" text-anchor="middle" font-size="19" fill="#4b3b6b">어제 내가 본 영상</text>

  <g>
    <rect x="30" y="74" width="96" height="58" rx="8" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M70 91 L 70 115 L 90 103 Z" fill="#4b3b6b"/>
    <text x="138" y="100" font-size="16" fill="#4b3b6b">게임 공략 ①</text>
    <text x="138" y="122" font-size="14" fill="#6b5b93">끝까지 봄</text>
  </g>
  <g>
    <rect x="30" y="144" width="96" height="58" rx="8" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M70 161 L 70 185 L 90 173 Z" fill="#4b3b6b"/>
    <text x="138" y="170" font-size="16" fill="#4b3b6b">게임 공략 ②</text>
    <text x="138" y="192" font-size="14" fill="#6b5b93">좋아요 꾹</text>
  </g>
  <g>
    <rect x="30" y="214" width="96" height="58" rx="8" fill="#f7c9de" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M70 231 L 70 255 L 90 243 Z" fill="#4b3b6b"/>
    <text x="138" y="240" font-size="16" fill="#4b3b6b">아이돌 직캠</text>
    <text x="138" y="262" font-size="14" fill="#6b5b93">끝까지 봄</text>
  </g>

  <!-- 가운데: 물음표 화살표 -->
  <path d="M274 150 L 402 150" stroke="#4b3b6b" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="338" cy="104" r="30" fill="#fbe6a2" stroke="#4b3b6b" stroke-width="3"/>
  <text x="338" y="117" text-anchor="middle" font-size="36" fill="#4b3b6b">?</text>
  <text x="338" y="186" text-anchor="middle" font-size="15" fill="#6b5b93">하룻밤 사이에</text>

  <!-- 오른쪽: 오늘 아침 홈 화면 -->
  <rect x="418" y="12" width="250" height="276" rx="16" fill="#fff6f9" stroke="#4b3b6b" stroke-width="3"/>
  <path d="M418 58 V 28 a16 16 0 0 1 16 -16 H 652 a16 16 0 0 1 16 16 V 58 Z" fill="#f7c9de" stroke="#4b3b6b" stroke-width="3"/>
  <text x="543" y="43" text-anchor="middle" font-size="19" fill="#4b3b6b">오늘 아침 유튜브 홈 화면</text>

  <g font-size="15" fill="#4b3b6b" text-anchor="middle">
    <rect x="434" y="72" width="104" height="62" rx="8" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M478 87 L 478 107 L 495 97 Z" fill="#4b3b6b"/>
    <text x="486" y="127">게임 공략 ③</text>
    <rect x="548" y="72" width="104" height="62" rx="8" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M592 87 L 592 107 L 609 97 Z" fill="#4b3b6b"/>
    <text x="600" y="127">게임 공략 ④</text>
    <rect x="434" y="144" width="104" height="62" rx="8" fill="#f7c9de" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M478 159 L 478 179 L 495 169 Z" fill="#4b3b6b"/>
    <text x="486" y="199">직캠 모음</text>
    <rect x="548" y="144" width="104" height="62" rx="8" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M592 159 L 592 179 L 609 169 Z" fill="#4b3b6b"/>
    <text x="600" y="199">보스 공략</text>
    <rect x="434" y="216" width="104" height="58" rx="8" fill="#f7c9de" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M478 229 L 478 249 L 495 239 Z" fill="#4b3b6b"/>
    <text x="486" y="268">직캠 4K</text>
    <rect x="548" y="216" width="104" height="58" rx="8" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="2.5"/>
    <path d="M592 229 L 592 249 L 609 239 Z" fill="#4b3b6b"/>
    <text x="600" y="268">게임 꿀팁</text>
  </g>
</svg>
