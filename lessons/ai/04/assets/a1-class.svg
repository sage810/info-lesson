<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="CookieRunSvg, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">
  <style id="svg-font">@font-face{font-family:'CookieRunSvg';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <!-- 활동 1 그림(2026-11-01): 다섯 친구의 AI가 같은 테스트 사진(탕후루)을 보고 답하는 만화 — 원이 AI 만 정답. 2번 이름표 정답(원인)은 그림에 넣지 않음 -->
  <rect x="0" y="0" width="680" height="310" fill="#fffdf7"/>
  <rect x="200" y="10" width="280" height="64" rx="16" fill="#f6f8fd" stroke="#4b3b6b" stroke-width="3"/>
  <text x="300" y="49" text-anchor="middle" font-size="19" fill="#4b3b6b">테스트 사진: 탕후루</text>
  <line x1="420" y1="16" x2="420" y2="70" stroke="#8a6a3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="420" cy="25" r="8" fill="#e8505b" stroke="#4b3b6b" stroke-width="2"/>
  <circle cx="420" cy="40" r="8" fill="#e8505b" stroke="#4b3b6b" stroke-width="2"/>
  <circle cx="420" cy="55" r="7" fill="#9b6ad6" stroke="#4b3b6b" stroke-width="2"/>
  <path d="M415 22 a4 4 0 0 1 5 -3 M415 37 a4 4 0 0 1 5 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- 제나 -->
  <rect x="10" y="96" width="116" height="40" rx="14" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <path d="M60 135 L 68 148 L 76 135" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <rect x="61" y="133" width="14" height="4" fill="#ffffff"/>
  <text x="68" y="122" text-anchor="middle" font-size="17" fill="#4b3b6b">마라탕?</text>
  <line x1="68" y1="156" x2="68" y2="168" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="68" cy="155" r="5" fill="#a65a86" stroke="#4b3b6b" stroke-width="2"/>
  <rect x="30" y="168" width="76" height="58" rx="14" fill="#c4d8f7" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="53" cy="192" r="6" fill="#4b3b6b"/><circle cx="83" cy="192" r="6" fill="#4b3b6b"/>
  <path d="M57 214 L 79 212" fill="none" stroke="#4b3b6b" stroke-width="3" stroke-linecap="round"/>
  <rect x="38" y="230" width="60" height="30" rx="8" fill="#c4d8f7" stroke="#4b3b6b" stroke-width="3"/>
  <text x="116" y="182" text-anchor="middle" font-size="24" fill="#a65a86">?</text>
  <text x="68" y="290" text-anchor="middle" font-size="17" fill="#4b3b6b">제나의 AI</text>
  <!-- 원이 -->
  <rect x="146" y="96" width="116" height="40" rx="14" fill="#d8f0c4" stroke="#4b3b6b" stroke-width="2.5"/>
  <path d="M196 135 L 204 148 L 212 135" fill="#d8f0c4" stroke="#4b3b6b" stroke-width="2.5"/>
  <rect x="197" y="133" width="14" height="4" fill="#d8f0c4"/>
  <text x="204" y="122" text-anchor="middle" font-size="17" fill="#4b3b6b">탕후루!</text>
  <line x1="204" y1="156" x2="204" y2="168" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="204" cy="155" r="5" fill="#f5b83d" stroke="#4b3b6b" stroke-width="2"/>
  <rect x="166" y="168" width="76" height="58" rx="14" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="189" cy="192" r="6" fill="#4b3b6b"/><circle cx="219" cy="192" r="6" fill="#4b3b6b"/>
  <path d="M191 208 Q 204 220 217 208" fill="none" stroke="#4b3b6b" stroke-width="3" stroke-linecap="round"/>
  <rect x="174" y="230" width="60" height="30" rx="8" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="3"/>
  <path d="M244 160 l 5 10 l 11 1 l -8 7 l 3 11 l -11 -6 l -11 6 l 3 -11 l -8 -7 l 11 -1 Z" fill="#f5b83d" stroke="#4b3b6b" stroke-width="2"/>
  <text x="204" y="290" text-anchor="middle" font-size="17" fill="#4b3b6b">원이의 AI</text>
  <!-- 메이 -->
  <rect x="282" y="96" width="116" height="40" rx="14" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <path d="M332 135 L 340 148 L 348 135" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <rect x="333" y="133" width="14" height="4" fill="#ffffff"/>
  <text x="340" y="122" text-anchor="middle" font-size="17" fill="#4b3b6b">떡볶이!</text>
  <line x1="340" y1="156" x2="340" y2="168" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="340" cy="155" r="5" fill="#a65a86" stroke="#4b3b6b" stroke-width="2"/>
  <rect x="302" y="168" width="76" height="58" rx="14" fill="#fbe6a2" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="325" cy="192" r="6" fill="#4b3b6b"/><circle cx="355" cy="192" r="6" fill="#4b3b6b"/>
  <path d="M329 214 L 351 212" fill="none" stroke="#4b3b6b" stroke-width="3" stroke-linecap="round"/>
  <rect x="310" y="230" width="60" height="30" rx="8" fill="#fbe6a2" stroke="#4b3b6b" stroke-width="3"/>
  <text x="388" y="182" text-anchor="middle" font-size="24" fill="#a65a86">?</text>
  <text x="340" y="290" text-anchor="middle" font-size="17" fill="#4b3b6b">메이의 AI</text>
  <!-- 미나미 -->
  <rect x="418" y="96" width="116" height="40" rx="14" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <path d="M468 135 L 476 148 L 484 135" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <rect x="469" y="133" width="14" height="4" fill="#ffffff"/>
  <text x="476" y="122" text-anchor="middle" font-size="17" fill="#4b3b6b">마라탕?</text>
  <line x1="476" y1="156" x2="476" y2="168" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="476" cy="155" r="5" fill="#a65a86" stroke="#4b3b6b" stroke-width="2"/>
  <rect x="438" y="168" width="76" height="58" rx="14" fill="#f7c9de" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="461" cy="192" r="6" fill="#4b3b6b"/><circle cx="491" cy="192" r="6" fill="#4b3b6b"/>
  <path d="M465 214 L 487 212" fill="none" stroke="#4b3b6b" stroke-width="3" stroke-linecap="round"/>
  <rect x="446" y="230" width="60" height="30" rx="8" fill="#f7c9de" stroke="#4b3b6b" stroke-width="3"/>
  <text x="524" y="182" text-anchor="middle" font-size="24" fill="#a65a86">?</text>
  <text x="476" y="290" text-anchor="middle" font-size="17" fill="#4b3b6b">미나미의 AI</text>
  <!-- 리브 -->
  <rect x="554" y="96" width="116" height="40" rx="14" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <path d="M604 135 L 612 148 L 620 135" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <rect x="605" y="133" width="14" height="4" fill="#ffffff"/>
  <text x="612" y="122" text-anchor="middle" font-size="17" fill="#4b3b6b">음… 몰라요</text>
  <line x1="612" y1="156" x2="612" y2="168" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="612" cy="155" r="5" fill="#a65a86" stroke="#4b3b6b" stroke-width="2"/>
  <rect x="574" y="168" width="76" height="58" rx="14" fill="#e2d6f7" stroke="#4b3b6b" stroke-width="3"/>
  <circle cx="597" cy="192" r="6" fill="#4b3b6b"/><circle cx="627" cy="192" r="6" fill="#4b3b6b"/>
  <path d="M601 214 L 623 212" fill="none" stroke="#4b3b6b" stroke-width="3" stroke-linecap="round"/>
  <rect x="582" y="230" width="60" height="30" rx="8" fill="#e2d6f7" stroke="#4b3b6b" stroke-width="3"/>
  <text x="660" y="182" text-anchor="middle" font-size="24" fill="#a65a86">?</text>
  <text x="612" y="290" text-anchor="middle" font-size="17" fill="#4b3b6b">리브의 AI</text>
</svg>
