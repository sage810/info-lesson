<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="CookieRunSvg, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">
  <style id="svg-font">@font-face{font-family:'CookieRunSvg';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <!-- 활동 2 그림(2026-11-01): 인공지능 시스템의 4단계 흐름도 + ④ → ① 점선(새 데이터). 칸에는 단계 이름만 — 1번 표 빈칸 정답을 알려 주지 않게 -->
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L 12 6 L 0 12 Z" fill="#4b3b6b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="250" fill="#fffdf7"/>

  <g text-anchor="middle" fill="#4b3b6b">
    <rect x="12" y="40" width="136" height="96" rx="16" fill="#c4d8f7" stroke="#4b3b6b" stroke-width="3"/>
    <text x="80" y="80" font-size="26">①</text>
    <text x="80" y="112" font-size="18">데이터 입력</text>

    <rect x="186" y="40" width="136" height="96" rx="16" fill="#fbe6a2" stroke="#4b3b6b" stroke-width="3"/>
    <text x="254" y="80" font-size="26">②</text>
    <text x="254" y="112" font-size="18">학습</text>

    <rect x="360" y="40" width="136" height="96" rx="16" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="3"/>
    <text x="428" y="80" font-size="26">③</text>
    <text x="428" y="112" font-size="18">예측(판단)</text>

    <rect x="534" y="40" width="136" height="96" rx="16" fill="#f7c9de" stroke="#4b3b6b" stroke-width="3"/>
    <text x="602" y="80" font-size="26">④</text>
    <text x="602" y="112" font-size="18">결과 활용</text>
  </g>

  <path d="M150 88 L 182 88" stroke="#4b3b6b" stroke-width="3.5" marker-end="url(#ar)"/>
  <path d="M324 88 L 356 88" stroke="#4b3b6b" stroke-width="3.5" marker-end="url(#ar)"/>
  <path d="M498 88 L 530 88" stroke="#4b3b6b" stroke-width="3.5" marker-end="url(#ar)"/>

  <!-- ④ → ① 되돌아가는 점선 -->
  <path d="M602 138 L 602 196 L 80 196 L 80 144" fill="none" stroke="#a65a86" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ar)"/>
  <rect x="226" y="180" width="228" height="34" rx="17" fill="#fffdf7"/>
  <text x="340" y="203" text-anchor="middle" font-size="17" fill="#a65a86">새 데이터가 다시 들어가요</text>
</svg>
