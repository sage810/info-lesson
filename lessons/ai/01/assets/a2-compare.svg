<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="CookieRunSvg, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">
  <style id="svg-font">@font-face{font-family:'CookieRunSvg';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <!-- 활동 2 그림(2026-10-18 다시 그림): 왼쪽 일반 소프트웨어 | 오른쪽 인공지능 소프트웨어 — 같은 줄끼리 비교
       만드는 재료 → 만들어진 것 → 결과. 화살표 이름은 화살표 옆(겹치지 않게). -->
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L 12 6 L 0 12 Z" fill="#4b3b6b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="380" fill="#fffdf7"/>

  <!-- ── 왼쪽: 일반 소프트웨어 ── -->
  <rect x="12" y="12" width="322" height="356" rx="16" fill="#f6f8fd" stroke="#4b3b6b" stroke-width="3"/>
  <path d="M12 60 V 28 a16 16 0 0 1 16 -16 H 318 a16 16 0 0 1 16 16 V 60 Z" fill="#c4d8f7" stroke="#4b3b6b" stroke-width="3"/>
  <text x="173" y="44" text-anchor="middle" font-size="21" fill="#4b3b6b">일반 소프트웨어</text>

  <rect x="48" y="78" width="250" height="62" rx="12" fill="#fbe6a2" stroke="#4b3b6b" stroke-width="2.5"/>
  <text x="173" y="104" text-anchor="middle" font-size="16" fill="#4b3b6b">사람이 정한 규칙</text>
  <text x="173" y="126" text-anchor="middle" font-size="12.5" fill="#6b5b93">예) 세 칸 안에 오면 공격!</text>

  <path d="M173 142 L 173 182" stroke="#4b3b6b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="186" y="168" font-size="13" fill="#6b5b93">사람이 코드로 입력</text>

  <rect x="48" y="188" width="250" height="56" rx="12" fill="#ffffff" stroke="#4b3b6b" stroke-width="3"/>
  <text x="173" y="222" text-anchor="middle" font-size="15.5" fill="#4b3b6b">규칙대로만 움직이는 프로그램</text>

  <path d="M173 246 L 173 286" stroke="#4b3b6b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="186" y="272" font-size="13" fill="#6b5b93">입력이 들어오면</text>

  <rect x="48" y="292" width="250" height="62" rx="12" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <text x="173" y="318" text-anchor="middle" font-size="16" fill="#4b3b6b">늘 같은 결과</text>
  <text x="173" y="340" text-anchor="middle" font-size="12" fill="#6b5b93">같은 입력이면 같은 답 · 스스로 배우지 않아요</text>

  <!-- ── 오른쪽: 인공지능 소프트웨어 ── -->
  <rect x="346" y="12" width="322" height="356" rx="16" fill="#f1fbf7" stroke="#4b3b6b" stroke-width="3"/>
  <path d="M346 60 V 28 a16 16 0 0 1 16 -16 H 652 a16 16 0 0 1 16 16 V 60 Z" fill="#bfe9dd" stroke="#4b3b6b" stroke-width="3"/>
  <text x="507" y="44" text-anchor="middle" font-size="21" fill="#4b3b6b">인공지능 소프트웨어</text>

  <rect x="382" y="78" width="250" height="62" rx="12" fill="#fbe6a2" stroke="#4b3b6b" stroke-width="2.5"/>
  <text x="507" y="104" text-anchor="middle" font-size="16" fill="#4b3b6b">데이터 + 정답 이름표</text>
  <text x="507" y="126" text-anchor="middle" font-size="12.5" fill="#6b5b93">예) 고양이·강아지 사진 수천 장</text>

  <path d="M507 142 L 507 182" stroke="#4b3b6b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="520" y="168" font-size="13" fill="#a65a86">스스로 학습</text>

  <rect x="382" y="188" width="250" height="56" rx="12" fill="#ffffff" stroke="#4b3b6b" stroke-width="3"/>
  <text x="507" y="222" text-anchor="middle" font-size="16" fill="#4b3b6b">인공지능 모델</text>

  <path d="M507 246 L 507 286" stroke="#4b3b6b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="520" y="272" font-size="13" fill="#6b5b93">새 입력이 들어오면</text>

  <rect x="382" y="292" width="250" height="62" rx="12" fill="#ffffff" stroke="#4b3b6b" stroke-width="2.5"/>
  <text x="507" y="318" text-anchor="middle" font-size="16" fill="#4b3b6b">예측</text>
  <text x="507" y="340" text-anchor="middle" font-size="12" fill="#6b5b93">처음 보는 것도 배운 대로 판단해요</text>
</svg>
