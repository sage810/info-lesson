<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인공지능이란? 모션그래픽</title>
<meta name="description" content="정보 · 인공지능 1차시 「인공지능이란?」 수업용 모션그래픽 — 자막만(소리 없음). 선생님이 설명하며 틀어 줘요.">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 글꼴 — 활동지와 같은 파일(shared/fonts). 미리보기 서버·아티팩트가 fonts/ 로 준다 */
@font-face{font-family:'GangwonEdu';font-weight:400;font-display:block;src:url(fonts/GangwonEdu-400.woff2) format('woff2')}
@font-face{font-family:'CookieRun';font-weight:400;font-display:block;src:url(fonts/CookieRun-400.woff2) format('woff2')}
@font-face{font-family:'CookieRun';font-weight:700;font-display:block;src:url(fonts/CookieRun-700.woff2) format('woff2')}
@font-face{font-family:'Maplestory';font-weight:300;font-display:block;src:url(fonts/Maplestory-300.woff2) format('woff2')}
@font-face{font-family:'Maplestory';font-weight:700;font-display:block;src:url(fonts/Maplestory-700.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-weight:400;font-display:block;src:url(fonts/Silkscreen-400.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-weight:700;font-display:block;src:url(fonts/Silkscreen-700.woff2) format('woff2')}

/* 색 = design/tokens.json role 값 그대로(활동지·PPT 와 같은 팔레트, 새 색 없음) */
:root{
  --ink:#4b3b6b; --ink2:#6b5b93; --rose-ink:#a65a86;
  --cream:#fffdf7; --page-bg:#e7e3f7; --page-grid:rgba(216,210,238,.75);
  --sky:#c4d8f7; --sky-body:#f4f8fe; --mint:#bfe9dd; --mint-body:#f1fbf7; --lav:#d6c4f5; --lav-body:#f8f4fe;
  --lime:#e3f4b0; --lime-body:#fbfdf0; --salmon:#f7bfb2; --salmon-body:#fff4f1; --sage:#c9e4dc; --sage-body:#f3faf7;
  --green:#d8f0c4; --green-body:#f7fcf2; --rose:#e8c4c4; --lilac:#eec6ea; --yellow:#fbe6a2; --ok:#a8e6cf; --no:#ffb3bd;
  --glass-top:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 62%);
  --glass-top-head:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.7),rgba(255,255,255,0) 62%);
  --glass-white:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.14) 55%,rgba(255,255,255,.42));
  --chip-glass:linear-gradient(120deg,rgba(253,225,243,.75),rgba(231,220,255,.75) 50%,rgba(214,241,255,.75));
  --glass-inset:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -8px 14px -10px rgba(255,255,255,.9);
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-out:cubic-bezier(.2,0,0,1);
  --round:'CookieRun',Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,sans-serif;
  --body:'Maplestory',Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,sans-serif;
  --pixel:'Silkscreen',monospace;
  --page-fg:#4b3b6b; --hint:#6b5b93;   /* 무대 바깥(책상·조작 줄)만 테마를 따른다 — 무대(영상)는 늘 크림 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page-bg:#2a2440;--page-grid:rgba(255,255,255,.07);--page-fg:#efe9ff;--hint:#c9c2dd;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#2a2440;--page-grid:rgba(255,255,255,.07);--page-fg:#efe9ff;--hint:#c9c2dd;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-weight:300;color:var(--page-fg);background:var(--page-bg);
  background-image:linear-gradient(var(--page-grid) 1px,transparent 1px),linear-gradient(90deg,var(--page-grid) 1px,transparent 1px);background-size:28px 28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:100%;overflow:hidden;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#box{position:relative;flex:none}
#wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--cream);color:var(--ink);
  border:4px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 rgba(75,59,107,.22);cursor:pointer}
#stage>*{pointer-events:none}
.scene{position:absolute;inset:0;opacity:0}
.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.abs{position:absolute}
.center{text-align:center}
.round{font-family:var(--round);font-weight:700}
b,strong{font-family:var(--round);font-weight:700}

/* 장면 머리 띠 = 활동지 카드 머리(단계 흰 이름표 + 픽셀 이름 + 제목), 유리 빛 */
.head{position:absolute;left:0;top:0;width:1920px;height:104px;display:flex;align-items:center;gap:22px;padding:0 64px;border-bottom:4px solid var(--ink)}
.head::after{content:'';position:absolute;inset:0;background:var(--glass-top-head);pointer-events:none}
.head .chip{display:inline-flex;align-items:center;height:50px;padding:0 22px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-family:var(--round);font-weight:700;font-size:28px}
.head .px{font-family:var(--pixel);font-weight:700;font-size:30px;letter-spacing:.02em}
.head .vdiv{width:3px;height:52px;background:var(--ink);border-radius:2px;opacity:.55}
.head .badge{display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:30px;line-height:1}
.head .ttl{font-family:var(--round);font-weight:700;font-size:42px;letter-spacing:-.01em}

/* 자막 — 아래 가운데, 흰 상자 + 3px 잉크, 핵심어는 형광펜 */
.capwrap{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;pointer-events:none}
.cap{max-width:1720px;padding:20px 40px;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:5px 5px 0 rgba(75,59,107,.16);
  font-size:38px;line-height:1.5;text-align:center;word-break:keep-all}
.cap b{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 3px;border-radius:4px}

/* 공통 부품 */
.card{border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:5px 5px 0 rgba(75,59,107,.16)}
.panel{border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 rgba(75,59,107,.16)}
.panel .ptitle{position:absolute;left:0;right:0;top:26px;text-align:center;font-family:var(--round);font-weight:700;font-size:36px}
.panel .pfoot{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:27px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:8px 26px;border:3px solid var(--ink);border-radius:999px;background:#fff;
  font-family:var(--round);font-weight:700;font-size:32px;line-height:1.3;box-shadow:4px 4px 0 rgba(75,59,107,.2);white-space:nowrap}
.pill.yellow{background:var(--yellow)} .pill.mint{background:var(--mint)} .pill.lav{background:var(--lav)} .pill.sky{background:var(--sky)} .pill.rose{background:var(--rose)}
.pill.xl{font-size:40px;padding:12px 36px} .pill.sm{font-size:26px;padding:4px 18px;box-shadow:3px 3px 0 rgba(75,59,107,.2)}
.pill .px{font-family:var(--pixel);font-size:.92em}
.tag{display:inline-block;padding:6px 18px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--round);font-weight:700;font-size:28px;box-shadow:3px 3px 0 rgba(75,59,107,.18)}
.sticker{position:absolute;padding:10px 30px;border:3px solid var(--ink);border-radius:16px;background:var(--mint);font-family:var(--round);font-weight:700;font-size:40px;box-shadow:5px 5px 0 rgba(75,59,107,.25)}
.note{font-size:26px;color:var(--ink2);line-height:1.45;text-align:center}
.abox{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 14px;border:3px solid var(--ink);border-radius:16px;background:#fff;text-align:center}
.abox .t{font-family:var(--round);font-weight:700;font-size:30px;line-height:1.25} .abox .d{font-size:22px;color:var(--ink2);line-height:1.3}
.abox.yellow{background:var(--yellow)} .abox.mint{background:var(--mint)} .abox.lav{background:var(--lav-body)}
.photo{position:absolute;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:18px;background:#fff}
.photo.dashed{border-style:dashed}
.photo svg{width:78%;height:78%}
.doodle{position:absolute;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:3px 3px 0 rgba(75,59,107,.14)}
.doodle svg{width:76%;height:76%}
.spark{position:absolute;width:18px;height:18px;background:var(--yellow);border:3px solid var(--ink);border-radius:4px;transform:rotate(45deg);offset-rotate:0deg;opacity:0}
.node{transform-box:fill-box;transform-origin:center}
.emo{font-size:64px;line-height:1.1}
.term{font-family:var(--round);font-weight:700;font-size:44px;line-height:1.2}
.mean{font-size:28px;color:var(--ink2);line-height:1.4;text-align:center;word-break:keep-all}
.big-title{font-family:'GangwonEdu',var(--round);font-weight:400;font-size:170px;line-height:1.05;letter-spacing:-.01em}
.sub{font-size:46px}
.step{display:inline-flex;align-items:center;gap:12px;height:66px;padding:0 24px 0 10px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-family:var(--round);font-weight:700;font-size:30px;box-shadow:4px 4px 0 rgba(75,59,107,.2)}
.step .coin{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;background:linear-gradient(135deg,#f8e6e6,#e8c4c4);font-size:24px}
.step.on{background:var(--lav);box-shadow:inset 0 -5px 0 var(--ink),4px 4px 0 rgba(75,59,107,.2)}
.col{position:absolute;border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 rgba(75,59,107,.16)}
.col .chead{height:84px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--ink);border-radius:21px 21px 0 0;font-family:var(--round);font-weight:700;font-size:36px}
.fchip{position:absolute;display:inline-flex;align-items:center;gap:14px;height:76px;padding:0 26px;border:3px solid var(--ink);border-radius:999px;background:#fff;
  font-family:var(--round);font-weight:700;font-size:29px;box-shadow:4px 4px 0 rgba(75,59,107,.2);white-space:nowrap}
.fchip .e{font-size:36px}
.tcard{position:absolute;width:540px;height:250px;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:5px 5px 0 rgba(75,59,107,.16);overflow:hidden}
.tcard .th{height:72px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--ink);font-family:var(--round);font-weight:700;font-size:36px}
.tcard .tb{padding:14px 22px;font-size:26px;line-height:1.45;text-align:center;word-break:keep-all}
.tcard .tx{margin-top:4px;font-size:23px;color:var(--ink2)}
.endtitle{font-family:var(--round);font-weight:700;font-size:72px;line-height:1.3}

/* 재생 조작(웹 보기) — 모든 버튼은 오로라 유리 알약(DESIGN.md) */
#ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;width:min(1920px,100%);padding:0 4px}
.glass-pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:999px;color:var(--ink);
  font-family:var(--round);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;
  background:var(--glass-top),var(--glass-white),var(--chip-glass);box-shadow:var(--glass-inset),3px 3px 0 rgba(75,59,107,.28);transition:transform .45s var(--ease-spring),box-shadow .25s var(--ease-out)}
.glass-pill:hover{box-shadow:var(--glass-inset),4px 4px 0 rgba(75,59,107,.28)}
.glass-pill:active{transform:scale(1.04,.9)}
.glass-pill:focus-visible{outline:3px solid #ee9dbf;outline-offset:2px}
.glass-pill.on{background:var(--glass-top),var(--glass-white),var(--lav);box-shadow:var(--glass-inset),inset 0 -4px 0 var(--ink),2px 2px 0 rgba(75,59,107,.35)}
.glass-pill.main{min-width:120px;font-size:17px}
#time{font-family:var(--pixel);font-size:16px;min-width:120px;text-align:center;color:var(--page-fg);font-variant-numeric:tabular-nums}
#seek{-webkit-appearance:none;appearance:none;flex:1 1 320px;min-width:220px;height:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;background:var(--glass-top),var(--glass-white),var(--chip-glass);box-shadow:2px 2px 0 rgba(75,59,107,.3)}
#hint{font-size:13px;color:var(--hint);width:100%;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.glass-pill{transition:none}}
#bigplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#bigplay span{display:inline-flex;align-items:center;justify-content:center;width:180px;height:180px;border:5px solid var(--ink);border-radius:50%;
  background:var(--glass-top),var(--glass-white),var(--chip-glass);box-shadow:var(--glass-inset),8px 8px 0 rgba(75,59,107,.28);font-size:90px;padding-left:16px;color:var(--ink)}
#bigplay.hide{display:none}
body.render{display:block;padding:0;background:var(--cream);background-image:none}
body.render #box{width:1920px;height:1080px}
body.render #stage{border:0;border-radius:0;box-shadow:none;cursor:default}
body.render #ctl,body.render #bigplay{display:none}
</style>
</head>

/* ───────── 재생기 ───────── */
let anims = [], DURATION = END * 1000, cur = 0, playing = false, raf = 0, last = 0;
function build() {
  anims = specs.map(s => { const a = s.el.animate(s.kf, { delay: s.delay, duration: s.duration, easing: s.easing, fill: s.fill, composite: s.composite }); a.pause(); return a; });
  DURATION = Math.max(END * 1000, ...specs.map(s => s.delay + s.duration));
  seek(0);
}
function seek(ms) { cur = Math.max(0, Math.min(DURATION, ms)); for (const a of anims) a.currentTime = cur; updateUI(); }
function tick(now) { if (!playing) return; const dt = now - last; last = now; seek(cur + dt); if (cur >= DURATION) { pause(); return; } raf = requestAnimationFrame(tick); }
function play() { if (cur >= DURATION) cur = 0; playing = true; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); updateUI(); }
function pause() { playing = false; cancelAnimationFrame(raf); updateUI(); }
const fmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const $ = id => document.getElementById(id);
function updateUI() {
  if (RENDER) return;
  $('time').textContent = `${fmt(cur)} / ${fmt(DURATION)}`;
  if (document.activeElement !== $('seek')) $('seek').value = Math.round(cur / DURATION * 1000);
  $('btnPlay').textContent = playing ? '⏸ 멈춤' : '▶ 재생'; $('btnPlay').setAttribute('aria-label', playing ? '멈춤' : '재생');
  $('bigplay').classList.toggle('hide', playing);
  const idx = CH.reduce((m, c, i) => cur >= c.t * 1000 - 1 ? i : m, 0);
  [...$('chapters').children].forEach((b, i) => b.classList.toggle('on', i === idx));
}
function fit() {
  if (RENDER) return;
  const ctlH = $('ctl').offsetHeight + 14 + 32;
  const sc = Math.min((innerWidth - 32) / 1920, (innerHeight - ctlH) / 1080);
  $('wrap').style.transform = `scale(${sc})`; $('box').style.width = (1920 * sc) + 'px'; $('box').style.height = (1080 * sc) + 'px';
}
function ui() {
  CH.forEach((c, i) => { const b = el('button', 'glass-pill', $('chapters'), null, c.name); b.type = 'button'; b.addEventListener('click', () => { seek(c.t * 1000); if (!playing) play(); }); });
  $('btnPlay').addEventListener('click', () => playing ? pause() : play());
  $('btnRestart').addEventListener('click', () => { seek(0); play(); });
  $('btnFull').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  $('seek').addEventListener('input', e => seek(e.target.value / 1000 * DURATION));
  stage.addEventListener('click', () => playing ? pause() : play());
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
    const idx = CH.reduce((m, c, i) => cur >= c.t * 1000 + 300 ? i : m, -1);
    if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === 'ArrowRight') { const n = CH.find(c => c.t * 1000 > cur + 300); seek(n ? n.t * 1000 : DURATION); }
    else if (e.key === 'ArrowLeft') { seek((CH[Math.max(0, idx)] || CH[0]).t * 1000); }
    else if (e.key === 'Home') seek(0);
  });
  addEventListener('resize', fit); fit();
  mp4Button();
}
/* 받는 링크(아티팩트)에서만: 딸린 파일 motion.mp4 를 downloads 기능으로 저장 — 로컬 보기에는 단추가 안 보인다 */
async function mp4Button() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  const dl = await window.claude.use('downloads').catch(() => null); if (!dl) return;
  const head = await fetch('motion.mp4', { method: 'HEAD' }).catch(() => null); if (!head || !head.ok) return;
  const btn = $('btnMp4'); btn.hidden = false; const label = '⬇ MP4 받기';
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = '⏳ 준비 중…';
    try {
      const r = await fetch('motion.mp4'); if (!r.ok) throw new Error('파일 없음');
      await dl.save({ filename: '정보수업_인공지능_01차시_모션그래픽.mp4', data: await r.blob() });
      btn.textContent = '✓ 저장했어요';
    } catch (e) { btn.textContent = e && e.code === 'declined' ? label : '받기 실패 · 다시 눌러 주세요'; }
    finally { btn.disabled = false; setTimeout(() => { btn.textContent = label; }, 3000); }
  });
}

window.__motion = { ready, get duration() { return DURATION; }, seek, play, pause, chapters: CH };
})();
